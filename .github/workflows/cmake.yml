name: Build and test

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.configuration }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {name: Linux GCC, os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {name: Linux Clang, os: ubuntu-24.04, cc: clang, cxx: clang++}
          - {name: Windows MSVC, os: windows-2022, cc: cl, cxx: cl}
        configuration: [Debug, Release]
        dependencies: [conan, submodules]
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      # Force GLFW to use Xvfb even if a runner exposes a Wayland session.
      XDG_SESSION_TYPE: x11
      WAYLAND_DISPLAY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install "conan>=2.10,<3" "cmake>=3.24,<4" ninja
      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers vulkan-validationlayers
      - name: Build and test Linux (including native PTY and Vulkan lifecycle)
        if: runner.os == 'Linux'
        env:
          IMTERM_VALIDATE_VULKAN: '1'
        run: >-
          xvfb-run -a python scripts/ci.py
          --configuration ${{ matrix.configuration }}
          --dependencies ${{ matrix.dependencies }}
          --graphics --lavapipe --install-system-packages
      - name: Build and test Windows
        if: runner.os == 'Windows'
        run: >-
          python scripts/ci.py
          --configuration ${{ matrix.configuration }}
          --dependencies ${{ matrix.dependencies }}
      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ runner.os }}-${{ matrix.toolchain.cc }}-${{ matrix.configuration }}-${{ matrix.dependencies }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/ci/test-results.xml
            out/ci/Testing/Temporary/
            out/ci/CMakeFiles/CMakeConfigureLog.yaml
            out/ci/CMakeCache.txt

  sanitizers:
    name: Linux Clang / ASan + UBSan + fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install "conan>=2.10,<3" "cmake>=3.24,<4" ninja
      - name: Build and test with sanitizers, then fuzz the parser
        run: >-
          python scripts/ci.py --configuration Debug
          --dependencies submodules --sanitizers --fuzz --install-system-packages
      - name: Upload test reports, diagnostics and fuzz corpus
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-sanitizers
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/ci/test-results.xml
            out/ci/Testing/Temporary/
            out/ci/CMakeFiles/CMakeConfigureLog.yaml
            out/ci/fuzz-corpus/
            out/ci/crash-*
            out/ci/leak-*
            out/ci/timeout-*

  ci:
    name: CI
    if: always()
    needs: [build, sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build and test job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        run: test "$BUILD_RESULT" = success && test "$SANITIZER_RESULT" = success
